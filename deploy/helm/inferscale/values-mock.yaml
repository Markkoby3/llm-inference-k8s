# CPU-only profile for kind, minikube and CI: the gateway runs its built-in mock
# backend, so the chart, probes, autoscaling and benchmark harness can be
# exercised end to end without a GPU.

vllm:
  enabled: false
triton:
  enabled: false

gateway:
  image:
    repository: inferscale-gateway
    tag: dev
    pullPolicy: Never  # image is side-loaded with `kind load docker-image`
  replicas: 1
  defaultBackend: mock
  # Three simulated replicas with a prefix cache, so CI exercises replica routing.
  mock:
    ttftMs: 40
    interTokenMs: 8
    replicas: 3
    prefixCacheSize: 8
    prefillMsPerKchar: 20
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
