[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inferscale"
version = "0.1.0"
description = "OpenAI-compatible LLM inference gateway over pluggable vLLM and NVIDIA Triton backends, with a throughput/latency benchmark harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Osei Kwabi" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Exact vector search through FAISS (falls back to NumPy without it).
faiss = ["faiss-cpu>=1.8"]
# Dense semantic embeddings instead of the default hashing embedder.
semantic = ["sentence-transformers>=3.0"]
dev = [
  "faiss-cpu>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
inferscale-gateway = "inferscale.__main__:main"
inferscale-bench = "inferscale.bench.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferscale"]

# The project's own documentation ships inside the package as the default
# corpus for the agent endpoint.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "inferscale/rag/bundled_docs"
"README.md" = "inferscale/rag/bundled_docs/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "SIM905"]  # SIM905: word lists read better as one split string
